name: Rename game file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename block-apocalypse.html to index.html
        run: |
          git config user.name "kangjackbe"
          git config user.email "kangjackbe@users.noreply.github.com"
          git mv block-apocalypse.html index.html
          git commit -m "Rename block-apocalypse.html to index.html"
          git push
